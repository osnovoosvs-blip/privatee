name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find pom.xml
        id: pom
        run: |
          POM=$(find . -name pom.xml -not -path '*/target/*' | head -n 1)
          if [ -z "$POM" ]; then
            echo "::error::pom.xml не найден. Загрузи в репозиторий распакованные файлы проекта, а не zip."
            exit 1
          fi
          echo "path=$POM" >> "$GITHUB_OUTPUT"

      - name: Build
        run: mvn -B -f "${{ steps.pom.outputs.path }}" package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PrivateBlocks
          path: '**/target/PrivateBlocks-*.jar'
